name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify project
        run: |
          ls -la
          xcodebuild -list -project SimpleAE.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild -project SimpleAE.xcodeproj \
            -scheme SimpleAE \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/SimpleAE.app Payload/
          zip -r SimpleAE.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAE-ipa
          path: SimpleAE.ipa